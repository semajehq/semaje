<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>semaje</title>
  <link rel="stylesheet" href="../ui/theme.css" />
  <style>
    body { width: 340px; padding: 14px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .actions { display: grid; gap: 8px; }
    .actions button { display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 10px 12px; }
    .actions button span:last-child { color: var(--muted); font-size: 11px; }
    footer { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    footer button { border: 0; background: none; padding: 4px 0; color: var(--accent); }
  </style>
</head>
<body>
  <header><h1>semaje</h1><span class="badge" id="server-badge">checking…</span></header>
  <div class="actions">
    <button class="primary" id="dictate"><span>Dictate into this page</span><span><kbd id="key-dictate">⌘⇧1</kbd></span></button>
    <button id="tab"><span>Transcribe this tab live</span><span><kbd id="key-tab">⌘⇧2</kbd></span></button>
    <button id="speak"><span>Read selection aloud</span><span><kbd id="key-read">⌘⇧3</kbd></span></button>
    <button id="file"><span>Transcribe a file…</span><span>any audio or video</span></button>
    <button id="stop" class="danger" hidden><span>Stop</span><span id="live-kind"></span></button>
  </div>
  <label for="lang">Spoken language</label>
  <input id="lang" autocomplete="off" role="combobox" aria-controls="lang-results" />
  <div class="lang-results" id="lang-results" role="listbox"></div>
  <div class="muted" id="lang-hint" style="font-size:11px;margin-top:4px"></div>
  <div class="status" id="msg" role="status"></div>
  <footer><button id="library">Open library</button><button id="settings">Settings</button></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
