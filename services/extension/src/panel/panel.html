<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>semaje library</title>
  <link rel="stylesheet" href="../ui/theme.css" />
  <style>
    body { padding: 12px; }
    .drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 14px; text-align: center; cursor: pointer; }
    .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .item { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .item .title { font-weight: 650; }
    .item .meta { color: var(--muted); font-size: 11px; }
    .item .preview { margin: 4px 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .item .row button, #detail .row button { padding: 4px 9px; font-size: 12px; }
    #detail p { white-space: pre-wrap; }
    progress { width: 100%; }
  </style>
</head>
<body>
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><h1>semaje</h1><button id="settings">Settings</button></div>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Transcribe a file">
    <strong>Transcribe a file</strong><br /><span class="muted">Drop or choose any audio or video: MP3, M4A, WAV, OGG, Opus, FLAC, AMR, WebM, MP4, MOV, MKV…</span>
    <input type="file" id="file" accept="audio/*,video/*,.amr,.opus,.caf,.mka,.mkv" hidden />
  </div>
  <div id="job" class="card stack" style="margin-top:10px" hidden>
    <div class="row" style="justify-content:space-between"><strong id="job-name"></strong><span class="badge" id="job-state"></span></div>
    <progress id="job-progress" max="100" value="0"></progress>
  </div>
  <input id="search" type="search" placeholder="Search transcripts…" style="margin-top:12px" aria-label="Search transcripts" />
  <div class="status" id="status" role="status"></div>
  <button id="back" hidden>← Back</button>
  <div id="list"></div>
  <div id="detail"></div>
  <script type="module" src="panel.js"></script>
</body>
</html>
