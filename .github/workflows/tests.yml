name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Brand + open-source gate (no old brand, no hosted-LLM vendor code)
        run: |
          # split strings so this workflow doesn't match itself
          PATTERN="vox""ail|vox-""ai|transcribe""-ai|transcribe""ai|gem""ini"
          ! git grep -n -i -E "$PATTERN" -- . ':!package-lock.json' \
            || (echo "Found old-brand or hosted-LLM references" && exit 1)
      - name: No cloud-sync conflict copies ("file 2.ts")
        run: |
          ! git ls-files | grep -E ' [0-9]+(\.[^/]*)?$' || (echo "Remove iCloud/Dropbox conflict copies" && exit 1)
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Node gate tests (all platform services)
        run: npm test
      - name: Deterministic quality smoke eval
        run: npm run eval:smoke
      - name: Compose files are valid (base, dev overlay, GPU overlays)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f compose.dev.yml config -q
          docker compose -f docker-compose.yml -f deploy/compose.workstation-gpu.yml config -q
          docker compose -f docker-compose.yml -f deploy/compose.server-gpu.yml config -q

  image:
    # API / worker / migrate image (one image, different commands).
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test
        run: |
          docker buildx build --load --target app -t semaje:ci .
          docker run --rm --entrypoint node semaje:ci --import tsx -e "await import('./services/api/src/app.ts'); console.log('api module loads')"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
      - name: Publish multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
