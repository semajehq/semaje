site_name: semaje · open-source speech for every language
site_url: https://semajehq.github.io/semaje/
repo_url: https://github.com/semajehq/semaje
repo_name: semajehq/semaje
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Languages and accuracy: languages.md
  - Browser extension: browser-extension.md
  - Low-cost operations: low-cost-operations.md
  - Quality evaluations: evaluations.md
  - Backup and restore: backup-restore.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
